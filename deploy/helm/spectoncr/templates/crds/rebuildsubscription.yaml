apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rebuildsubscriptions.spectoncr.io
  labels:
    {{- include "spectoncr.labels" . | nindent 4 }}
spec:
  group: spectoncr.io
  names:
    kind: RebuildSubscription
    listKind: RebuildSubscriptionList
    plural: rebuildsubscriptions
    singular: rebuildsubscription
    shortNames:
      - rsub
    categories:
      - spectoncr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef
        - name: Emitter
          type: string
          jsonPath: .spec.emitter.type
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: RebuildSubscription fires CI when a watched base image is patched (design 018).
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [tenantRef, emitter]
              properties:
                tenantRef:
                  type: string
                  minLength: 1
                watch:
                  type: object
                  properties:
                    bases:
                      type: array
                      items:
                        type: string
                    descendants:
                      type: array
                      items:
                        type: string
                triggers:
                  type: object
                  properties:
                    onCveFix:
                      type: boolean
                      default: true
                    onBasePush:
                      type: boolean
                      default: false
                    minSeverityFixed:
                      type: string
                      default: high
                emitter:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [github-dispatch]
                    repo:
                      type: string
                    workflow:
                      type: string
                    eventType:
                      type: string
                    tokenSecretRef:
                      type: string
                rateLimit:
                  type: object
                  properties:
                    perDownstreamPerDay:
                      type: integer
                      default: 1
                      minimum: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
