apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imageverificationpolicies.spectoncr.io
  labels:
    {{- include "spectoncr.labels" . | nindent 4 }}
spec:
  group: spectoncr.io
  names:
    kind: ImageVerificationPolicy
    listKind: ImageVerificationPolicyList
    plural: imageverificationpolicies
    singular: imageverificationpolicy
    shortNames:
      - ivp
    categories:
      - spectoncr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef
        - name: Required
          type: boolean
          jsonPath: .spec.required
        - name: OnViolation
          type: string
          jsonPath: .spec.onViolation
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: ImageVerificationPolicy enforces cosign signature checks on pull (design 001).
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - tenantRef
              properties:
                tenantRef:
                  type: string
                  minLength: 1
                scope:
                  type: object
                  properties:
                    projects:
                      type: array
                      items:
                        type: string
                    repositories:
                      type: array
                      items:
                        type: string
                required:
                  type: boolean
                  default: true
                trustedSigners:
                  type: array
                  items:
                    type: object
                    required:
                      - kind
                    properties:
                      kind:
                        type: string
                        enum: [Key, Keyless]
                      keyRef:
                        type: string
                      identityName:
                        type: string
                      issuer:
                        type: string
                      subjectPattern:
                        type: string
                onViolation:
                  type: string
                  enum: [block, warn, log]
                  default: block
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
