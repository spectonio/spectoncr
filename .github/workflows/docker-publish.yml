name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes that can't affect the image (it's built from Cargo.toml,
    # Cargo.lock and crates/ only). Without this, every docs/manifest merge
    # published a new, non-reproducible :latest digest and the in-cluster
    # image updaters rolled registry, auth and mirror in acc/int/test.
    # Path filters don't apply to the v* tag pushes.
    paths-ignore:
      - "docs/**"
      - "deploy/**"
      - "examples/**"
      - "**.md"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so `git describe` can find tags

      - name: Build metadata
        id: bmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPECTONCR_VERSION=${{ steps.bmeta.outputs.version }}
            SPECTONCR_BUILD_HASH=${{ steps.bmeta.outputs.sha }}
            SPECTONCR_BUILD_TIME=${{ steps.bmeta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
