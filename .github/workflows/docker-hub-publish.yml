name: Publish to Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes that can't affect the image (it's built from Cargo.toml,
    # Cargo.lock and crates/ only). Without this, every docs/manifest merge
    # published a new, non-reproducible :latest digest and the in-cluster
    # image updaters rolled registry, auth and mirror in acc/int/test.
    # Path filters don't apply to the v* tag pushes.
    paths-ignore:
      - "docs/**"
      - "deploy/**"
      - "examples/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: edge)"
        required: false
        default: ""
      platforms:
        description: "Target platforms (default amd64-only; set multi-arch for public arm64 releases)"
        required: false
        default: "linux/amd64"

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKER_HUB_USERNAME }}/spectoncr
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build & Push Multi-Arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so `git describe` can find tags

      - name: Build metadata
        id: bmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS=""
          GHCR_REPO="ghcr.io/${{ github.repository }}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            MAJOR_MINOR="${VERSION%.*}"
            TAGS="${DOCKERHUB_REPO}:${VERSION}"
            TAGS="${TAGS},${DOCKERHUB_REPO}:${MAJOR_MINOR}"
            TAGS="${TAGS},${DOCKERHUB_REPO}:latest"
            TAGS="${TAGS},${GHCR_REPO}:${VERSION}"
            TAGS="${TAGS},${GHCR_REPO}:${MAJOR_MINOR}"
            TAGS="${TAGS},${GHCR_REPO}:latest"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAGS="${DOCKERHUB_REPO}:${{ github.event.inputs.tag }}"
            TAGS="${TAGS},${GHCR_REPO}:${{ github.event.inputs.tag }}"
          else
            SHA="${GITHUB_SHA::7}"
            TAGS="${DOCKERHUB_REPO}:edge"
            TAGS="${TAGS},${DOCKERHUB_REPO}:${SHA}"
            TAGS="${TAGS},${DOCKERHUB_REPO}:latest"
            TAGS="${TAGS},${GHCR_REPO}:edge"
            TAGS="${TAGS},${GHCR_REPO}:${SHA}"
            TAGS="${TAGS},${GHCR_REPO}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64-only by default: the target clusters are amd64, and emulating
          # arm64 under QEMU turned a ~8-min build into ~2h. Pass a multi-arch
          # value via workflow_dispatch `platforms` for public arm64 releases.
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SPECTONCR_VERSION=${{ steps.bmeta.outputs.version }}
            SPECTONCR_BUILD_HASH=${{ steps.bmeta.outputs.sha }}
            SPECTONCR_BUILD_TIME=${{ steps.bmeta.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.DOCKERHUB_REPO }}:edge"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
        if: github.ref == 'refs/heads/main'

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ env.DOCKERHUB_REPO }}
          readme-filepath: ./DOCKERHUB.md
        if: hashFiles('DOCKERHUB.md') != ''
